apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: production-cert-issuer
spec:
  acme:
    email: cloud.team+launchpad@rocket.chat
    privateKeySecretRef:
      name: cert-manager-secret-production
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
    - http01:
       ingress:
         class: traefik
