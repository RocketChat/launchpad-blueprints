apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: helm-controller
  annotations:
    launchpad-registry-overwrite-cm: "imageRegistry:(registry)"

    launchpad-registry-overwrite-imagePullSecrets-global: "global.imagePullSecrets[].name:launchpad-registry-credentials"
spec:
  repo: https://charts.jetstack.io
  chart: cert-manager
  version: v1.20.4
  targetNamespace: cert-manager
  createNamespace: true
  securityContext:
    runAsUser: 1000
  valuesContent: |-
    crds:
      enabled: true
    webhook:
      hostNetwork: true
      securePort: 10260
