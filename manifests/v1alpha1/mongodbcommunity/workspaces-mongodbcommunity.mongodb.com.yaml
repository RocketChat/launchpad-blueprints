apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: workspaces
  namespace: mongodb
spec:
  members: 3
  type: ReplicaSet
  version: "8.0.17"
  prometheus:
    username: prometheus-username
    passwordSecretRef:
      name: metrics-endpoint-password
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: workspaces-admin
      db: admin
      passwordSecretRef: # handled by launchpad
        name: workspaces-mongodb-admin-secret
      roles:
        - name: clusterAdmin
          db: admin
        - name: userAdminAnyDatabase
          db: admin
      scramCredentialsSecretName: my-scram
  additionalMongodConfig:
    storage.wiredTiger.engineConfig.journalCompressor: zlib
  statefulSet:
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: mongodb
      template:
        metadata:
          labels:
           app.kubernetes.io/name: mongodb
        spec:
          containers:
            - name: mongod
              resources: # handled by launchpad
                limits:
                  cpu: 1500m
                  memory: 6Gi
                requests:
                  cpu: 500m
                  memory: 3Gi
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - mongodb
                  topologyKey: "kubernetes.io/hostname"
      volumeClaimTemplates: # handled by launchpad
        - metadata:
            name: data-volume
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: mongodb-sc
            resources:
              requests:
                storage: 30G
        - metadata:
            name: logs-volume
          spec:
            accessModes: [ "ReadWriteOnce" ]
            storageClassName: mongodb-sc
            resources:
              requests:
                storage: 4G
