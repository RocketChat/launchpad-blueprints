apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: monitoring
  namespace: helm-controller
  annotations:
    launchpad-registry-overwrite-global: "global.imageRegistry:(registry)"
    
    launchpad-registry-overwrite-operator: "operator.global.imageRegistry:(registry)"
    
    # https://grafana.github.io/grafana-operator/docs/installation/helm/
    launchpad-registry-overwrite-grafana: "grafana.image.repository:(registry)/grafana/grafana-operator"
    launchpad-registry-overwrite-grafana-im: "grafana.deploy.image:(registry)/grafana/grafana:11.3.0"

    launchpad-registry-overwrite-loki: "loki.global.image.registry:(registry)"
    launchpad-registry-overwrite-loki-mem: "loki.memcached.image.repository:library/memcached"
    launchpad-registry-overwrite-loki-sidecar: "loki.sidecar.image.registry:(registry)"
    launchpad-registry-overwrite-loki-sidecar-repo: "loki.sidecar.image.repository:kiwigrid/k8s-sidecar"
    
    launchpad-registry-overwrite-otel: "opentelemetryCollector.image.registry:(registry)/otel/opentelemetry-collector-contrib"
    
    launchpad-registry-overwrite-imagePullSecrets-global: "global.imagePullSecrets[].name:launchpad-registry-credentials"
    launchpad-registry-overwrite-imagePullSecrets-operator: "operator.global.imagePullSecrets[].name:launchpad-registry-credentials"
    launchpad-registry-overwrite-imagePullSecrets-grafana: "grafana.imagePullSecrets[].name:launchpad-registry-credentials"
    launchpad-registry-overwrite-imagePullSecrets-loki: "loki.imagePullSecrets[].name:launchpad-registry-credentials"
    launchpad-registry-overwrite-imagePullSecrets-loki-gw: "loki.gateway.imagePullSecrets[].name:launchpad-registry-credentials"
    launchpad-registry-overwrite-imagePullSecrets-loki-mem: "loki.memcached.imagePullSecrets[].name:launchpad-registry-credentials"
spec:
  repo: https://rocketchat.github.io/helm-charts
  chart: monitoring
  version: 0.0.17
  targetNamespace: monitoring
  createNamespace: true
  valuesContent: |-
    operator:
      prometheus:
        prometheusSpec:
          storageSpec:
            volumeClaimTemplate:
              spec:
                storageClassName: monitoring-sc

    grafana:
      enabled: true
      deploy:
        enabled: true
        storageClassName: monitoring-sc
      dashboards:
        airgapped: true

    loki:
      limits_config:
        retention_period: 15d  # Data older than 15 days is marked for deletion

      # Based on 10GB/day ingestion and a 15d retention period
      # Total Disk=(Daily Raw Volume×Retention Days×0.15)+Safety Buffer (20%)
      singleBinary:
        persistence:
          size: 30Gi # overwrite precedence over global loki.persistence below... since it is declared on monitoring helm chart
          storageClass: monitoring-sc

      global:
        cluster:
          profile: "" # Emptying the profile prevents it from forcing production-sized caches

      deploymentMode: SingleBinary

      storage:
        type: filesystem

      # Resource Allocation
      # Note: Memory requests and limits are identical to prevent OOM kills during query spikes
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: 2 # Allows Loki to burst during heavy LogQL queries
          memory: 2Gi

      # Note: Loki: Keep the cache for performance but don't want it stealing 10Gi of RAM
      #
      # Force the Chunks Cache to a small footprint
      chunksCache:
        enabled: true
        allocatedMemory: 512  # This is the "Magic" key. Value in MB.
        # We must also force the resources here to match
        resources:
          requests:
            cpu: 100m
            memory: 700Mi
          limits:
            cpu: 500m
            memory: 700Mi

      # Force the Results Cache to a small footprint
      resultsCache:
        enabled: true
        allocatedMemory: 512
        resources:
          requests:
            cpu: 100m
            memory: 700Mi
          limits:
            cpu: 500m
            memory: 700Mi

      # Prevent the Memcached sub-chart from using its global defaults
      memcached:
        resources:
          requests:
            cpu: 100m
            memory: 700Mi
          limits:
            cpu: 500m
            memory: 700Mi
