apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: monitoring
  namespace: helm-controller
spec:
  repo: https://rocketchat.github.io/helm-charts
  chart: monitoring
  version: 0.0.6
  targetNamespace: monitoring
  createNamespace: true
  valuesContent: |-
    grafana:
      enabled: true
      dashboards:
        extra:
          - name: "mongodb-global"
            id: "23712"
            revision: latest
