apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: monitoring
  namespace: helm-controller
spec:
  valuesContent: |-
    operator:
      prometheus:
        prometheusSpec:
          storageSpec:
            volumeClaimTemplate:
              spec:
                storageClassName: longhorn

    grafana:
      enabled: true
      deploy:
        enabled: true
        storageClassName: longhorn
