apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: launchcontrol
    control-plane: controller-manager
  name: launchcontrol-controller-manager
  namespace: launchcontrol-system
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /manager
        env:
        - name: CLUSTER_ISSUER
          value: production-cert-issuer
        - name: READINESS_TIMEOUT
          value: 7m
        - name: OLD_RESOURCE_CLEANUP
          value: "true"
        - name: CONCURRENT_RECONCILES
          value: "7"
        image: rocketchat/launchcontrol:f6dc32ccedc1cf6e598c11dd40b3b63707182d18
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsNonRoot: true
      serviceAccountName: launchcontrol-controller-manager
      terminationGracePeriodSeconds: 10
