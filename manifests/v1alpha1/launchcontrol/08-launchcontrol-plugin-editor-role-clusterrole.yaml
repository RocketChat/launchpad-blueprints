apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: launchcontrol
  name: launchcontrol-plugin-editor-role
rules:
- apiGroups:
  - launchcontrol.cloud.rocket.chat
  resources:
  - plugins
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - launchcontrol.cloud.rocket.chat
  resources:
  - plugins/status
  verbs:
  - get
