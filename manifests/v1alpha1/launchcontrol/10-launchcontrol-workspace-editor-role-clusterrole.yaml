apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: launchcontrol
  name: launchcontrol-workspace-editor-role
rules:
- apiGroups:
  - launchcontrol.cloud.rocket.chat
  resources:
  - workspaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - launchcontrol.cloud.rocket.chat
  resources:
  - workspaces/status
  verbs:
  - get
